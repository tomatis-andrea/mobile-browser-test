# Finestre del telefono o del browser che possono coprire la pagina (solo se ci sono).
appId: ${APP_ID}
---
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn:
          text: "Wait"
          optional: true
- runFlow:
    when:
      visible: "No thanks"
    commands:
      - tapOn:
          text: "No thanks"
          optional: true
- runFlow:
    when:
      visible: "Use without an account"
    commands:
      - tapOn:
          text: "Use without an account"
          optional: true
# suggerimento di Safari (iOS 26) sopra la barra degli indirizzi. Non toccare il testo del suggerimento: apre il
# pannello di segnalibri e pannelli, che copre la pagina. Si chiude con la sua X o toccando in alto sulla pagina.
- runFlow:
    when:
      visible: "View Bookmarks.*"
    commands:
      - tapOn:
          text: "Close"
          optional: true
- runFlow:
    when:
      visible: "View Bookmarks.*"
    commands:
      - tapOn:
          point: 50%, 8%
# banner dei cookie di Enigmap: copre GIOCA su un simulatore appena creato (visto sul Mac, mai su GitHub)
- runFlow:
    when:
      visible: "Rifiuta"
    commands:
      - tapOn:
          text: "Rifiuta"
          optional: true
