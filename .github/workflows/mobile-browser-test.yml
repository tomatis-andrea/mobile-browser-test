# Banco prova dei browser su telefono: Safari sul simulatore iPhone (macOS) e Chrome sull'emulatore Android
# (Linux con KVM), comandati da Maestro. Il test da eseguire è quello indicato in run.txt.
#
# Sicurezza (repository pubblico, minuti illimitati):
# - indirizzo del sito e IP Tailscale nel segreto TEST_CONFIG; dati del test (pagina, squadra) in tests/<nome>.enc,
#   criptati con il segreto TEST_KEY (tools/nuovo-test.sh); nei log compaiono come ***;
# - il runner entra nella rete Tailscale solo per il test (nodo effimero, tag:ci: può aprire solo il sito di sviluppo);
# - screenshot e video criptati con age prima del caricamento (chiave privata solo sul server), tenuti 1 giorno;
# - azioni esterne fissate a un commit preciso, Maestro dalla release ufficiale con verifica sha256;
# - parte solo da push sul ramo main o a mano (mai da pull request di altri), permessi in sola lettura.
name: Mobile browser test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-browser-test
  cancel-in-progress: true

env:
  MAESTRO_VERSION: cli-2.12.1
  MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7

jobs:
  ios-safari:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
      - uses: ./.github/actions/load-test
        timeout-minutes: 2
        with:
          test-config: ${{ secrets.TEST_CONFIG }}
          test-key: ${{ secrets.TEST_KEY }}
      # prima di Tailscale: sul Mac, dopo, i nomi pubblici come github.com non si risolvono più (vedi join-tailnet)
      - uses: ./.github/actions/install-tools
        timeout-minutes: 5
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
          maestro-sha256: ${{ env.MAESTRO_SHA256 }}
      # prima di Tailscale: avviato dopo, il simulatore restava bloccato in avvio
      # Il Mac di GitHub ha 7 GB: con simulatore + Maestro la memoria libera scendeva a ~60 MB e il carico a ~1000
      # (tutto rallenta o si pianta). Si spengono i servizi che non servono prima di avviare il simulatore.
      - name: Free memory (macOS)
        timeout-minutes: 3
        run: |
          sudo mdutil -a -i off > /dev/null 2>&1 || true
          sudo killall -9 mds mds_stores mdworker_shared mdworker photoanalysisd itunescloudd cloudd bird \
            suggestd knowledge-agent com.apple.photomoments 2>/dev/null || true
          vm_stat | awk '/Pages free/{printf "memoria libera: %d MB\n", $3*16384/1048576}'

      - name: Boot iPhone simulator (newest iOS)
        id: sim
        timeout-minutes: 10
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 flows/pick-iphone.py)
          # in background e con controllo a tempo: `simctl boot`/`bootstatus` a volte non tornano più
          xcrun simctl boot "$UDID" &
          for _ in $(seq 1 60); do
            xcrun simctl list devices | grep -q "$UDID) (Booted)" && break
            sleep 5
          done
          xcrun simctl list devices | grep -q "$UDID) (Booted)" || { echo "simulatore non avviato in 5 minuti"; exit 1; }
          sleep 20  # SpringBoard e Safari pronti
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # iPhone: niente Tailscale sul Mac di GitHub (si bloccava). Il sito si apre dal Funnel pubblico, che viene aperto
      # solo per il test dalla skill (scripts/funnel.sh) e chiuso subito dopo.
      - name: Check site reachable (public Funnel)
        timeout-minutes: 3
        run: curl -sS -o /dev/null -w "HTTP %{http_code}\n" --retry 5 --retry-delay 5 --max-time 30 "$BASE_URL/it"

      - name: Test Safari
        # dopo un errore Maestro su iOS a volte non esce più: senza limite il job aspetterebbe i 30 minuti
        timeout-minutes: 15
        run: bash flows/ios.sh "${{ steps.sim.outputs.udid }}"

      - if: always()
        uses: ./.github/actions/save-results
        timeout-minutes: 5
        with:
          name: ios-safari

  android-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        timeout-minutes: 2
      - uses: ./.github/actions/load-test
        timeout-minutes: 2
        with:
          test-config: ${{ secrets.TEST_CONFIG }}
          test-key: ${{ secrets.TEST_KEY }}
      - uses: ./.github/actions/install-tools
        timeout-minutes: 5
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
          maestro-sha256: ${{ env.MAESTRO_SHA256 }}
      - uses: ./.github/actions/join-tailnet
        timeout-minutes: 5  # di solito 1 minuto; se si pianta, fallisce subito e il log si apre
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Install maestro-runner (only if runner.txt asks for it)
        if: hashFiles('runner.txt') != ''
        timeout-minutes: 3
        run: |
          set -euo pipefail
          V=1.1.31; F=maestro-runner-$V-linux-amd64.tar.gz
          B=https://github.com/devicelab-dev/maestro-runner/releases/download/v$V
          mkdir -p "$HOME/mr" && cd "$HOME/mr"
          curl -fsSL -O "$B/$F" -O "$B/$F.sha256"
          sha256sum -c "$F.sha256" && tar xzf "$F"

      - name: Enable KVM
        timeout-minutes: 2
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Chrome on Android emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: playstore
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash flows/android.sh

      - if: always()
        uses: ./.github/actions/save-results
        timeout-minutes: 5
        with:
          name: android-chrome
