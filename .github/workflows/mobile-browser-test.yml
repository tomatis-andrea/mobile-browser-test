# Banco prova dei browser su telefono: Safari sul simulatore iPhone (macOS) e Chrome sull'emulatore Android
# (Linux con KVM), comandati da Maestro. Il test da eseguire è quello indicato in run.txt.
#
# Sicurezza (repository pubblico, minuti illimitati):
# - indirizzo del sito e IP Tailscale nel segreto TEST_CONFIG; dati del test (pagina, squadra) in tests/<nome>.enc,
#   criptati con il segreto TEST_KEY (tools/nuovo-test.sh); nei log compaiono come ***;
# - il runner entra nella rete Tailscale solo per il test (nodo effimero, tag:ci: può aprire solo il sito di sviluppo);
# - screenshot e video criptati con age prima del caricamento (chiave privata solo sul server), tenuti 1 giorno;
# - azioni esterne fissate a un commit preciso, Maestro dalla release ufficiale con verifica sha256;
# - parte solo da push sul ramo main o a mano (mai da pull request di altri), permessi in sola lettura.
name: Mobile browser test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-browser-test
  cancel-in-progress: true

env:
  MAESTRO_VERSION: cli-2.12.1
  MAESTRO_SHA256: 54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7

jobs:
  ios-safari:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/load-test
        with:
          test-config: ${{ secrets.TEST_CONFIG }}
          test-key: ${{ secrets.TEST_KEY }}
      # prima di Tailscale: sul Mac, dopo, i nomi pubblici come github.com non si risolvono più (vedi join-tailnet)
      - uses: ./.github/actions/install-tools
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
          maestro-sha256: ${{ env.MAESTRO_SHA256 }}
      # prima di Tailscale: avviato dopo, il simulatore restava bloccato in avvio
      - name: Boot iPhone simulator (newest iOS)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 flows/pick-iphone.py)
          # in background e con controllo a tempo: `simctl boot`/`bootstatus` a volte non tornano più
          xcrun simctl boot "$UDID" &
          for _ in $(seq 1 60); do
            xcrun simctl list devices | grep -q "$UDID) (Booted)" && break
            sleep 5
          done
          xcrun simctl list devices | grep -q "$UDID) (Booted)" || { echo "simulatore non avviato in 5 minuti"; exit 1; }
          sleep 20  # SpringBoard e Safari pronti
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/join-tailnet
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Test Safari
        # dopo un errore Maestro su iOS a volte non esce più: senza limite il job aspetterebbe i 30 minuti
        timeout-minutes: 20
        run: bash flows/ios.sh "${{ steps.sim.outputs.udid }}"

      # Dopo il test Tailscale non serve più. Acceso, il Mac non risolve i nomi di GitHub e il passo seguente fallisce
      # già all'avvio ("Failed to resolve action download info"): per questo è un passo a parte, non dentro save-results.
      - name: Leave tailnet (restore DNS)
        if: always()
        run: |
          sudo tailscale down || true
          sudo pkill tailscaled || true
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder || true
          for _ in $(seq 1 30); do
            dscacheutil -q host -a name launch.actions.githubusercontent.com | grep -q ip_address && break
            sleep 2
          done
          dscacheutil -q host -a name launch.actions.githubusercontent.com | grep -c ip_address || scutil --dns | head -20

      - if: always()
        uses: ./.github/actions/save-results
        with:
          name: ios-safari

  android-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/load-test
        with:
          test-config: ${{ secrets.TEST_CONFIG }}
          test-key: ${{ secrets.TEST_KEY }}
      - uses: ./.github/actions/install-tools
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
          maestro-sha256: ${{ env.MAESTRO_SHA256 }}
      - uses: ./.github/actions/join-tailnet
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Chrome on Android emulator
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: playstore
          arch: x86_64
          profile: pixel_7
          cores: 4
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash flows/android.sh

      - if: always()
        uses: ./.github/actions/save-results
        with:
          name: android-chrome
